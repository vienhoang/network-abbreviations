<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & Cybersecurity Abbreviations</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --background: #ecf0f1;
            --card-background: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-color: #bdc3c7;
            --shadow: rgba(0, 0, 0, 0.1);
            --hover-shadow: rgba(52, 152, 219, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .search-container {
            margin-bottom: 2rem;
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            color: var(--text-secondary);
            font-size: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1.25rem 1.5rem 1.25rem 4rem;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            background: var(--background);
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .results-info {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-background);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid transparent;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px var(--hover-shadow);
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .abbreviation {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .stands-for {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .meaning {
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: white;
            font-size: 1.2rem;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 4rem;
            padding: 2rem 1rem;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .creator {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .donation-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        .bitcoin-address {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            max-width: 500px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bitcoin-address:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .linkedin-link {
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            background: #0077b5;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .linkedin-link:hover {
            background: #005885;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 119, 181, 0.4);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .results-container {
                grid-template-columns: 1fr;
            }

            input[type="text"] {
                font-size: 1rem;
            }

            .abbreviation {
                font-size: 1.5rem;
            }
        }

        .highlight {
            background: linear-gradient(120deg, #ffd700 0%, #ffed4e 100%);
            padding: 0 4px;
            border-radius: 3px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [abbreviations, setAbbreviations] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Simulerar AJAX-hämtning av JSON-data
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        setLoading(true);
                        // I produktion: ersätt med din JSON-fil URL
                        // const response = await fetch('network_abbr.json');
                        
                        // För demo: använd inbäddad data eller extern URL
                        const response = await fetch('network_abbr.json');
                        
                        if (!response.ok) {
                            throw new Error('Failed to fetch data');
                        }
                        
                        const data = await response.json();
                        setAbbreviations(data);
                        setLoading(false);
                    } catch (err) {
                        setError(err.message);
                        setLoading(false);
                        console.error('Error fetching data:', err);
                    }
                };

                // Simulera nätverksfördröjning för att visa laddningsanimation
                setTimeout(fetchData, 500);
            }, []);

            // Filtrerar resultat baserat på sökterm (AJAX-liknande funktion)
            const filteredResults = useMemo(() => {
                if (!searchTerm.trim()) {
                    return abbreviations;
                }

                const searchLower = searchTerm.toLowerCase();
                
                return abbreviations.filter(item => {
                    const abbr = item['Network Abbreviation'].toLowerCase();
                    const standsFor = item['Stands For'].toLowerCase();
                    const meaning = item['Meaning'].toLowerCase();
                    
                    return abbr.includes(searchLower) || 
                           standsFor.includes(searchLower) || 
                           meaning.includes(searchLower);
                });
            }, [searchTerm, abbreviations]);

            // Highlightar matchande text
            const highlightText = (text, search) => {
                if (!search.trim()) return text;
                
                const parts = text.split(new RegExp(`(${search})`, 'gi'));
                return parts.map((part, i) => 
                    part.toLowerCase() === search.toLowerCase() ? 
                        <span key={i} className="highlight">{part}</span> : part
                );
            };

            if (loading) {
                return (
                    <div className="container">
                        <header>
                            <h1>Network & Cybersecurity Abbreviations</h1>
                            <p className="subtitle">Your reference guide to network technology and cybersecurity.</p>
                        </header>
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Loading abbreviations...</p>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="container">
                        <header>
                            <h1>Network & Cybersecurity Abbreviations</h1>
                        </header>
                        <div className="no-results">
                            <div className="no-results-icon">⚠️</div>
                            <p>Could not load data: {error}</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <header>
                        <h1>Network & Cybersecurity Abbreviations</h1>
                        <p className="subtitle">Your reference guide to network technology and cybersecurity.</p>
                    </header>

                    <div className="search-container">
                        <div className="search-wrapper">
                            <span className="search-icon">🔍</span>
                            <input
                                type="text"
                                placeholder="Search by abbreviation, name or description..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                autoFocus
                            />
                        </div>
                        <div className="results-info">
                            Show {filteredResults.length} by {abbreviations.length} abbreviation
                        </div>
                    </div>

                    {filteredResults.length === 0 ? (
                        <div className="no-results">
                            <div className="no-results-icon">🔎</div>
                            <p>No results found for "{searchTerm}"</p>
                            <p style={{fontSize: '0.9rem', marginTop: '0.5rem', opacity: 0.8}}>
                                Try searching for a different abbreviation or term.
                            </p>
                        </div>
                    ) : (
                        <div className="results-container">
                            {filteredResults.map((item, index) => (
                                <div key={index} className="card">
                                    <div className="card-header">
                                        <div className="abbreviation">
                                            {highlightText(item['Network Abbreviation'], searchTerm)}
                                        </div>
                                    </div>
                                    <div className="stands-for">
                                        {highlightText(item['Stands For'], searchTerm)}
                                    </div>
                                    <div className="meaning">
                                        {highlightText(item['Meaning'], searchTerm)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <footer>
                        <div className="footer-content">
                            <div className="creator">
                                Created by<strong>Vien Hoang</strong>
                            </div>
                            
                            <div className="donation-section">
                                <div style={{fontSize: '0.9rem', opacity: 0.9}}>
                                    💰 Bitcoin Donations
                                </div>
                                <div 
                                    className="bitcoin-address"
                                    onClick={() => {
                                        navigator.clipboard.writeText('bc1qhkn7uvcajuuss8l07hhl9ux2as0cc9uj2zdcwf');
                                        alert('Bitcoin address copied!');
                                    }}
                                    title="Click to copy">
                                    bc1qhkn7uvcajuuss8l07hhl9ux2as0cc9uj2zdcwf
                                </div>
                            </div>

                            <a 
                                href="https://www.linkedin.com/in/vien-hoang-5077bb96/" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="linkedin-link"
                            >
                                <span>in</span>
                                Visit my LinkedIn profile
                            </a>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
